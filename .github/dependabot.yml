version: 2
updates:
  # GitHub Actions in .github/workflows. Die Actions sind per Commit-SHA festgelegt; Dependabot
  # schlägt neue Versionen als PR vor, die CI prüft sie wie jeden anderen PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  # Basis-Image des ISO-Builds: build/Dockerfile legt ubuntu:26.04 per Digest fest. Dependabot schlägt
  # einen neuen Digest unter demselben Tag als PR vor, eine andere Ubuntu-Fassung nicht.
  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "Build"
