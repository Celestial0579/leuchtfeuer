# SSH wird nur über den Assistenten gestartet (Werkzeuge > SSH). Wie man sich anmeldet, schreibt er
# dabei in 00-lf-anmeldung.conf, die vor dieser Datei gelesen wird (bei sshd gilt der erste Wert):
# mit Schlüsseln von LF-SSH nur mit ihnen, sonst nur mit einem Einmal-Passwort (#99).
PermitRootLogin no
# Claude (lf-claude) meldet sich nie per SSH an, auch nicht mit einem Schlüssel, den es selbst in
# sein Home legt (GHSA-p86q-3456-f288). Anmelden darf sich nur der Live-Benutzer.
DenyUsers lf-claude
AllowUsers rescue
# Schlüssel nur aus dem RAM: Dort stehen die Schlüssel von LF-SSH, die auf tty1 bestätigt sind,
# jeder mit restrict,pty. ~/.ssh/authorized_keys liest sshd nicht.
AuthorizedKeysFile /run/lf/ssh/authorized_keys
KbdInteractiveAuthentication no
# Anmeldung über PAM wie in der sshd_config von Ubuntu. Ohne PAM wiese sshd jedes Konto mit
# gesperrtem Passwort ab, auch bei einer Anmeldung mit Schlüssel.
UsePAM yes
# Keine Weiterleitung von Agent, Ports, X11 oder Tunneln, auch mit dem Einmal-Passwort: Einen
# weitergeleiteten Agenten könnte Claude während einer Freigabe benutzen.
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
PermitUserRC no
# Jede Anmeldung und jeder Fehlversuch mit Zeit, Adresse und Fingerabdruck. Der Assistent übernimmt
# das ins Protokoll (tools_ssh_log_sync).
LogLevel VERBOSE
