# ptrace ab dem Start gesperrt (#85): Kein Prozess kann sich per ptrace an einen anderen hängen,
# auch root nicht. Den Wert 3 kann bis zum nächsten Start niemand mehr senken. Die Datei steht
# hinter 10-ptrace.conf von Ubuntu (Wert 1): systemd-sysctl liest die Dateien in der Reihenfolge der
# Namen und schreibt je Schlüssel nur den letzten Wert, also 3. Stünde sie davor, gälte die 1.
kernel.yama.ptrace_scope = 3
