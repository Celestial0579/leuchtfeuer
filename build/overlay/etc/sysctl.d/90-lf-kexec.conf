# kexec ab dem Start gesperrt (GHSA-874q-q3v7-m56v): Niemand kann einen Kernel für kexec laden, auch
# root nicht, auch keinen für den Absturzfall. Den Wert 1 kann bis zum nächsten Start niemand mehr
# zurücksetzen. Kein Neustart springt so in einen Kernel, den jemand während einer Freigabe geladen
# hat, mit einer initrd, die niemand prüft.
kernel.kexec_load_disabled = 1
