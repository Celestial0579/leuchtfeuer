# Merker für eine Claude-Freigabe seit dem Start (GHSA-874q-q3v7-m56v): beim Start 2, unprivilegiertes
# BPF ist aus. lf-freigabe an setzt vor der Regel 1. Von 1 lässt der Kernel den Wert bis zum nächsten
# Start nicht mehr zurücksetzen, auch nicht für root: Eine Freigabe seit dem Start zeigt er auch dann,
# wenn root ihre Marken unter /run gelöscht hat. Ubuntu startet ohnehin mit 2, die Datei macht den
# Startwert fest.
kernel.unprivileged_bpf_disabled = 2
