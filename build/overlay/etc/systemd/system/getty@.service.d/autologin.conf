# Auf jeder Konsole (tty1 bis tty6) ist der Live-Benutzer ohne Passwort angemeldet. Auf tty1
# startet dann der Assistent (/etc/skel/.bash_profile), auf den anderen eine Shell. Eine Anmeldung
# mit Passwort gibt es nicht: lf-passwort-sperre.service sperrt das Passwort bei jedem Start
# (GHSA-j332-2v26-m4qm). Für den seriellen Port (serial-getty@) gilt das nicht, dort meldet sich
# niemand an.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin rescue --noclear %I $TERM
